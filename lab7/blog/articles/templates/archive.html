<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>Архив статей</title>
    <link rel="stylesheet" href="{{ STATIC_URL }}css/article.css">
</head>
<body class="archive">
    <div class="header">
        <img src="{{ STATIC_URL }}img/logo.png" alt="Django public blog" />
        <div class="header-links">
            {% if user.is_authenticated %}
                <span class="user-greeting">Привет, {{ user.username }}!</span>
                <a href="/article/new/" class="header-link">Написать статью</a>
                <a href="/logout/" class="header-link">Выйти</a>
            {% else %}
                <a href="/register/" class="header-link">Регистрация</a>
                <a href="/login/" class="header-link">Войти</a>
            {% endif %}
        </div>
    </div>

    <div class="archive">
        {% for post in posts %}
        <div class="one-post">
            <h2 class="post-title"><a href="/article/{{ post.id }}">{{ post.title }}</a></h2>
            <button class="fold-button">свернуть</button>
            <div class="article-info">
                <div class="article-author">{{ post.author.username }}</div>
                <div class="article-created-date">{{ post.created_date }}</div>
            </div>
            <p class="article-text">{{ post.get_excerpt }}</p>
        </div>
        {% endfor %}
    </div>

    <script src="{{ STATIC_URL }}js/helloworld.js"></script>
    <script src="{{ STATIC_URL }}js/fold-post.js"></script>
</body>
</html>
